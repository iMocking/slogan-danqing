<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>丹青劫·无限 - 角色档案</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1920px; height: 1080px; overflow: hidden;
    font-family: "KaiTi", "STKaiti", "楷体", serif;
    background: #F5F0E1;
  }
  .screen {
    position: relative; width: 1920px; height: 1080px;
    background: linear-gradient(180deg, #e8e4d8 0%, #d4d0c4 100%);
  }
  .bg-mountain {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 600px 300px at 20% 50%, rgba(50,50,50,0.15) 0%, transparent 70%);
  }
  .main-panel {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 1600px; height: 880px;
    background: #EDE4D0; border: 4px solid #8B6F47;
    box-shadow: 0 12px 48px rgba(0,0,0,0.2);
  }
  .panel-title {
    text-align: center; font-size: 56px; color: #2C2C2C;
    letter-spacing: 12px; padding: 24px 0 16px; font-weight: bold;
  }
  .panel-title .seal {
    display: inline-block; width: 32px; height: 32px;
    background: #B83A2A; color: #F5F0E1; font-size: 14px;
    vertical-align: middle; margin-left: 8px; border-radius: 3px;
  }
  .content {
    display: flex; padding: 0 60px; gap: 40px; height: 720px;
  }
  /* 左侧装备+立绘 */
  .left-section {
    width: 480px; display: flex; gap: 20px;
  }
  .equip-col {
    display: flex; flex-direction: column; gap: 20px; padding-top: 40px;
  }
  .equip-slot {
    width: 100px; height: 100px; background: #F8F4E8;
    border: 2px solid #8B6F47; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .equip-slot .icon { font-size: 44px; }
  .equip-slot .label { font-size: 13px; color: #5a4a3a; margin-top: 4px; }
  .character-portrait {
    flex: 1; background: linear-gradient(180deg, #e8e4d8 0%, #d8d4c8 100%);
    border: 2px solid #8B6F47; display: flex; align-items: center; justify-content: center;
    font-size: 120px; color: #5a4a3a;
  }
  /* 中间属性区 */
  .mid-section {
    flex: 1; padding-top: 30px;
  }
  .char-name {
    font-size: 48px; color: #2C2C2C; margin-bottom: 16px;
  }
  .sect-tag {
    display: inline-block; padding: 6px 20px; background: #5a6b7a;
    color: #F5F0E1; font-size: 18px; margin-bottom: 20px;
  }
  .realm-row {
    display: flex; align-items: center; gap: 12px; margin-bottom: 16px;
    font-size: 20px; color: #2C2C2C;
  }
  .realm-label {
    background: #2C2C2C; color: #F5F0E1; padding: 4px 12px; font-size: 16px;
  }
  .cultivation-bar {
    width: 400px; height: 20px; background: #d4d0c4;
    border: 1px solid #8B6F47; position: relative; margin-left: 12px;
  }
  .cultivation-fill {
    width: 68%; height: 100%; background: linear-gradient(90deg, #C9A961, #d4b978);
  }
  .stat-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px 40px;
    margin-top: 30px; font-size: 20px;
  }
  .stat-row { color: #2C2C2C; line-height: 2.2; }
  .stat-row .label { color: #5a4a3a; display: inline-block; width: 80px; }
  /* 右侧深层属性 */
  .right-section {
    width: 280px;
  }
  .deep-panel {
    background: #d8d4c8; border: 2px solid #8B6F47;
    padding: 20px; margin-top: 30px;
  }
  .deep-title {
    text-align: center; font-size: 22px; color: #2C2C2C;
    margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #8B6F47;
  }
  .deep-row {
    display: flex; justify-content: space-between; font-size: 18px;
    color: #2C2C2C; line-height: 2.4;
  }
  .deep-row .val { color: #B83A2A; }
  /* 底部按钮 */
  .bottom-btns {
    display: flex; justify-content: center; gap: 24px; margin-top: 20px;
  }
  .btn {
    padding: 12px 36px; font-size: 18px; border: 2px solid #8B6F47;
    background: #F8F4E8; color: #2C2C2C; cursor: pointer;
  }
</style>
</head>
<body>
<div class="screen">
  <div class="bg-mountain"></div>

  <div class="main-panel">
    <div class="panel-title">角色档案<span class="seal">册</span></div>
    <div class="content">
      <div class="left-section">
        <div class="equip-col">
          <div class="equip-slot"><span class="icon">🗡</span><span class="label">青锋剑</span></div>
          <div class="equip-slot"><span class="icon">👘</span><span class="label">白云道袍</span></div>
          <div class="equip-slot"><span class="icon">🥾</span><span class="label">踏云靴</span></div>
        </div>
        <div class="character-portrait">🧙‍♂️</div>
        <div class="equip-col" style="padding-top: 40px;">
          <div class="equip-slot"><span class="icon">👑</span><span class="label">青云道冠</span></div>
          <div class="equip-slot"><span class="icon">📿</span><span class="label">灵玉珮</span></div>
          <div class="equip-slot"><span class="icon">💍</span><span class="label">储物戒</span></div>
        </div>
      </div>

      <div class="mid-section">
        <div class="char-name">青云子</div>
        <div class="sect-tag">青云门</div>
        <div class="realm-row">
          <span class="realm-label">境界</span>
          <span>筑基中期 45级</span>
        </div>
        <div class="realm-row">
          <span style="color: #5a4a3a;">修为</span>
          <div class="cultivation-bar"><div class="cultivation-fill"></div></div>
          <span style="margin-left: 8px;">68%</span>
        </div>

        <div class="stat-grid">
          <div class="stat-row"><span class="label">气血</span>12580/15000</div>
          <div class="stat-row"><span class="label">命中</span>850</div>
          <div class="stat-row"><span class="label">真元</span>8600/10000</div>
          <div class="stat-row"><span class="label">闪避</span>620</div>
          <div class="stat-row"><span class="label">攻击</span>2560</div>
          <div class="stat-row"><span class="label">暴击</span>15%</div>
          <div class="stat-row"><span class="label">防御</span>1280</div>
          <div class="stat-row"><span class="label">攻速</span>110%</div>
        </div>

        <div class="bottom-btns">
          <div class="btn">换装</div>
          <div class="btn">修为</div>
          <div class="btn">称号</div>
        </div>
      </div>

      <div class="right-section">
        <div class="deep-panel">
          <div class="deep-title">深层属性</div>
          <div class="deep-row"><span>筋骨</span><span class="val">+128</span></div>
          <div class="deep-row"><span>灵气</span><span class="val">+96</span></div>
          <div class="deep-row"><span>根骨</span><span class="val">+75</span></div>
          <div class="deep-row"><span>悟性</span><span class="val">+88</span></div>
          <div class="deep-row"><span>幸运</span><span class="val">+45</span></div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
