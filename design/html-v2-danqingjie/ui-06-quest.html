<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>丹青劫·无限 - 任务录</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1920px; height: 1080px; overflow: hidden;
    font-family: "KaiTi", "STKaiti", "楷体", serif;
    background: #F5F0E1;
  }
  .screen {
    position: relative; width: 1920px; height: 1080px;
    background: linear-gradient(180deg, #e8e4d8 0%, #d4d0c4 100%);
  }
  .bg-mountain {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 600px 300px at 15% 50%, rgba(50,50,50,0.15) 0%, transparent 70%),
                radial-gradient(ellipse 700px 350px at 90% 45%, rgba(50,50,50,0.12) 0%, transparent 70%);
  }
  .main-panel {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 1500px; height: 880px;
    background: #EDE4D0; border: 4px solid #8B6F47;
    box-shadow: 0 12px 48px rgba(0,0,0,0.2);
  }
  .panel-title {
    text-align: center; font-size: 56px; color: #2C2C2C;
    letter-spacing: 12px; padding: 24px 0 16px; font-weight: bold;
  }
  .panel-title .seal {
    display: inline-block; width: 32px; height: 32px;
    background: #B83A2A; color: #F5F0E1; font-size: 14px;
    vertical-align: middle; margin-left: 8px; border-radius: 3px;
  }
  .tabs {
    display: flex; margin: 0 60px; border-bottom: 2px solid #8B6F47;
  }
  .tab {
    padding: 12px 40px; font-size: 22px; color: #5a4a3a;
    cursor: pointer; border: 2px solid transparent; border-bottom: none;
  }
  .tab.active {
    background: #F8F4E8; border-color: #8B6F47; color: #2C2C2C; font-weight: bold;
    margin-bottom: -2px;
  }
  .content {
    display: flex; padding: 30px 60px; gap: 40px; height: 720px;
  }
  /* 左侧任务列表 */
  .quest-list {
    width: 520px; display: flex; flex-direction: column; gap: 4px;
  }
  .quest-item {
    padding: 18px 20px; background: #F8F4E8;
    border: 1px solid #8B6F47; cursor: pointer;
    display: flex; justify-content: space-between; align-items: center;
  }
  .quest-item.active {
    background: #e8e0d0; border-left: 4px solid #B83A2A;
  }
  .quest-name { font-size: 22px; color: #2C2C2C; font-weight: bold; }
  .quest-desc { font-size: 15px; color: #5a4a3a; margin-top: 4px; }
  .quest-progress { font-size: 18px; color: #2C2C2C; }
  .quest-dot {
    width: 10px; height: 10px; background: #B83A2A; border-radius: 50%;
    display: inline-block; margin-right: 6px;
  }
  /* 右侧详情 */
  .quest-detail {
    flex: 1; background: #F8F4E8; border: 2px solid #8B6F47;
    padding: 30px;
  }
  .detail-title { font-size: 36px; color: #2C2C2C; margin-bottom: 16px; }
  .quest-type {
    display: inline-block; padding: 4px 16px; background: #B83A2A;
    color: #F5F0E1; font-size: 16px; margin-bottom: 20px;
  }
  .quest-desc-text {
    font-size: 18px; color: #5a4a3a; line-height: 1.9; margin-bottom: 28px;
  }
  .objective-title { font-size: 20px; color: #2C2C2C; margin-bottom: 12px; }
  .objective-row {
    font-size: 18px; color: #2C2C2C; line-height: 2;
    padding-left: 8px;
  }
  .reward-title { font-size: 20px; color: #2C2C2C; margin: 24px 0 12px; }
  .reward-row { font-size: 18px; color: #5a4a3a; line-height: 2; }
  .detail-btns {
    display: flex; gap: 20px; margin-top: 30px; justify-content: flex-end;
  }
  .btn {
    padding: 12px 36px; font-size: 18px; border: 2px solid #8B6F47;
    background: #F8F4E8; color: #2C2C2C; cursor: pointer;
  }
  .btn.primary { background: #B83A2A; color: #F5F0E1; border-color: #C9A961; }
</style>
</head>
<body>
<div class="screen">
  <div class="bg-mountain"></div>

  <div class="main-panel">
    <div class="panel-title">任务录<span class="seal">录</span></div>

    <div class="tabs">
      <div class="tab active">已接任务</div>
      <div class="tab">可接任务</div>
      <div class="tab">已完成</div>
    </div>

    <div class="content">
      <div class="quest-list">
        <div class="quest-item active">
          <div>
            <div class="quest-name">青云山除妖</div>
            <div class="quest-desc">消灭山妖</div>
          </div>
          <div class="quest-progress">3/5</div>
        </div>
        <div class="quest-item">
          <div>
            <div class="quest-name">寻找灵草</div>
            <div class="quest-desc">采集七星草</div>
          </div>
          <div class="quest-progress">1/3</div>
        </div>
        <div class="quest-item">
          <div>
            <div class="quest-name">拜访师叔</div>
          </div>
          <div class="quest-progress"><span class="quest-dot"></span>可交付</div>
        </div>
      </div>

      <div class="quest-detail">
        <div class="detail-title">青云山除妖</div>
        <div class="quest-type">主线任务</div>
        <div class="quest-desc-text">
          青云山近来山妖作祟，伤害过往弟子。掌门命你前往清剿，以保山门安宁。
        </div>
        <div class="objective-title">任务目标</div>
        <div class="objective-row">☐ 目标1：消灭山妖 3/5</div>
        <div class="objective-row">☐ 目标2：收集妖丹 0/3</div>

        <div class="reward-title">任务奖励</div>
        <div class="reward-row">修为 5000</div>
        <div class="reward-row">铜钱 20000</div>
        <div class="reward-row">装备箱 ×1</div>

        <div class="detail-btns">
          <div class="btn primary">追踪任务</div>
          <div class="btn">放弃任务</div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
