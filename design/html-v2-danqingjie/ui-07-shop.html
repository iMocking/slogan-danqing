<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>丹青劫·无限 - 聚宝阁</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1920px; height: 1080px; overflow: hidden;
    font-family: "KaiTi", "STKaiti", "楷体", serif;
    background: #F5F0E1;
  }
  .screen {
    position: relative; width: 1920px; height: 1080px;
    background: linear-gradient(180deg, #e8e4d8 0%, #d4d0c4 100%);
  }
  .bg-mountain {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 600px 300px at 10% 50%, rgba(50,50,50,0.15) 0%, transparent 70%),
                radial-gradient(ellipse 700px 350px at 95% 45%, rgba(50,50,50,0.12) 0%, transparent 70%);
  }
  .main-panel {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 1600px; height: 880px;
    background: #EDE4D0; border: 4px solid #8B6F47;
    box-shadow: 0 12px 48px rgba(0,0,0,0.2);
    display: flex; flex-direction: column;
  }
  .panel-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 20px 40px 10px;
  }
  .panel-title {
    font-size: 48px; color: #2C2C2C; letter-spacing: 10px; font-weight: bold;
  }
  .panel-title .seal {
    display: inline-block; width: 28px; height: 28px;
    background: #B83A2A; color: #F5F0E1; font-size: 12px;
    vertical-align: middle; margin-left: 6px; border-radius: 3px;
  }
  .top-right {
    display: flex; align-items: center; gap: 16px;
  }
  .currency-tag {
    background: #3a3a3a; color: #F5F0E1; padding: 8px 16px;
    font-size: 16px; display: flex; align-items: center; gap: 8px;
  }
  .btn-recharge {
    background: #B83A2A; color: #F5F0E1; padding: 8px 24px;
    font-size: 16px; border: 2px solid #C9A961; cursor: pointer;
  }
  .content {
    flex: 1; display: flex; padding: 20px 40px; gap: 30px;
  }
  /* 左侧分类 */
  .category-nav {
    width: 160px; display: flex; flex-direction: column; gap: 4px;
  }
  .cat-item {
    padding: 14px 20px; font-size: 20px; color: #5a4a3a;
    cursor: pointer; border-left: 3px solid transparent;
  }
  .cat-item.active {
    background: #F8F4E8; color: #2C2C2C; font-weight: bold;
    border-left-color: #B83A2A;
  }
  /* 商品网格 */
  .shop-grid {
    flex: 1; display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 20px; align-content: start;
  }
  .shop-item {
    background: #F8F4E8; border: 2px solid #8B6F47;
    padding: 20px; display: flex; flex-direction: column;
    align-items: center; position: relative;
  }
  .hot-tag {
    position: absolute; top: 0; left: 0; background: #B83A2A;
    color: #F5F0E1; padding: 4px 12px; font-size: 14px;
  }
  .item-icon { font-size: 64px; margin-bottom: 12px; }
  .item-name { font-size: 20px; color: #2C2C2C; margin-bottom: 12px; }
  .item-price {
    display: flex; align-items: center; gap: 8px;
    font-size: 18px; color: #5a4a3a; margin-bottom: 12px;
  }
  .buy-btn {
    padding: 6px 24px; border: 2px solid #8B6F47; background: #EDE4D0;
    font-size: 16px; color: #2C2C2C; cursor: pointer;
  }
</style>
</head>
<body>
<div class="screen">
  <div class="bg-mountain"></div>

  <div class="main-panel">
    <div class="panel-header">
      <div class="panel-title">聚宝阁<span class="seal">宝</span></div>
      <div class="top-right">
        <div class="currency-tag">💎 灵石 3,200</div>
        <div class="currency-tag">💠 仙玉 680</div>
        <div class="btn-recharge">充值</div>
      </div>
    </div>

    <div class="content">
      <div class="category-nav">
        <div class="cat-item active">推荐</div>
        <div class="cat-item">限时特惠</div>
        <div class="cat-item">装备</div>
        <div class="cat-item">丹药</div>
        <div class="cat-item">材料</div>
        <div class="cat-item">外观</div>
        <div class="cat-item">礼观</div>
      </div>

      <div class="shop-grid">
        <div class="shop-item">
          <div class="item-icon">🟡</div>
          <div class="item-name">九转金丹</div>
          <div class="item-price">🪙 98 仙玉</div>
          <div class="buy-btn">购买</div>
        </div>
        <div class="shop-item">
          <div class="item-icon">📦</div>
          <div class="item-name">强化石礼盒</div>
          <div class="item-price">🪙 50 仙玉</div>
          <div class="buy-btn">购买</div>
        </div>
        <div class="shop-item">
          <div class="item-icon">🧴</div>
          <div class="item-name">修为丹</div>
          <div class="item-price">🪙 30 仙玉</div>
          <div class="buy-btn">购买</div>
        </div>
        <div class="shop-item">
          <div class="item-icon">👘</div>
          <div class="item-name">时装·青云</div>
          <div class="item-price">🪙 198 仙玉</div>
          <div class="buy-btn">购买</div>
        </div>

        <div class="shop-item">
          <div class="hot-tag">热卖</div>
          <div class="item-icon">🎫</div>
          <div class="item-name">背包扩展符</div>
          <div class="item-price">🪙 20 仙玉</div>
          <div class="buy-btn">购买</div>
        </div>
        <div class="shop-item">
          <div class="item-icon">📿</div>
          <div class="item-name">复活符</div>
          <div class="item-price">🪙 10 仙玉</div>
          <div class="buy-btn">购买</div>
        </div>
        <div class="shop-item">
          <div class="item-icon">🕊</div>
          <div class="item-name">坐骑·仙鹤</div>
          <div class="item-price">💎 288 仙玉</div>
          <div class="buy-btn">购买</div>
        </div>
        <div class="shop-item">
          <div class="item-icon">🦊</div>
          <div class="item-name">宠物·灵狐</div>
          <div class="item-price">💎 258 仙玉</div>
          <div class="buy-btn">购买</div>
        </div>

        <div class="shop-item">
          <div class="item-icon">🔮</div>
          <div class="item-name">称号·修仙者</div>
          <div class="item-price">🪙 68 仙玉</div>
          <div class="buy-btn">购买</div>
        </div>
        <div class="shop-item">
          <div class="item-icon">💠</div>
          <div class="item-name">双倍修为卡</div>
          <div class="item-price">🪙 25 仙玉</div>
          <div class="buy-btn">购买</div>
        </div>
        <div class="shop-item">
          <div class="item-icon"> chest </div>
          <div class="item-name">装备宝箱</div>
          <div class="item-price">🪙 88 仙玉</div>
          <div class="buy-btn">购买</div>
        </div>
        <div class="shop-item">
          <div class="item-icon">📜</div>
          <div class="item-name">弟子招募令</div>
          <div class="item-price">🪙 128 仙玉</div>
          <div class="buy-btn">购买</div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
