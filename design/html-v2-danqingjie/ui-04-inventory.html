<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>丹青劫·无限 - 背包</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1920px; height: 1080px; overflow: hidden;
    font-family: "KaiTi", "STKaiti", "楷体", serif;
    background: #F5F0E1;
  }
  .screen {
    position: relative; width: 1920px; height: 1080px;
    background: linear-gradient(180deg, #e8e4d8 0%, #d4d0c4 100%);
  }
  .bg-mountain {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 600px 300px at 20% 50%, rgba(50,50,50,0.15) 0%, transparent 70%),
                radial-gradient(ellipse 700px 350px at 85% 45%, rgba(50,50,50,0.12) 0%, transparent 70%);
  }
  /* 卷轴主面板 */
  .main-panel {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 1500px; height: 880px;
    background: #EDE4D0; border: 4px solid #8B6F47;
    box-shadow: 0 12px 48px rgba(0,0,0,0.2);
    display: flex; flex-direction: column;
  }
  .panel-title {
    text-align: center; font-size: 56px; color: #2C2C2C;
    letter-spacing: 12px; padding: 20px 0 10px; font-weight: bold;
  }
  .panel-title .seal {
    display: inline-block; width: 32px; height: 32px;
    background: #B83A2A; color: #F5F0E1; font-size: 14px;
    vertical-align: middle; margin-left: 8px; border-radius: 3px;
  }
  /* 标签页 */
  .tabs {
    display: flex; margin: 20px 60px 0; border-bottom: 2px solid #8B6F47;
  }
  .tab {
    padding: 12px 36px; font-size: 20px; color: #5a4a3a;
    cursor: pointer; border: 2px solid transparent; border-bottom: none;
  }
  .tab.active {
    background: #F8F4E8; border-color: #8B6F47; color: #2C2C2C; font-weight: bold;
    margin-bottom: -2px;
  }
  /* 内容区 */
  .content {
    flex: 1; display: flex; padding: 30px 60px; gap: 40px;
  }
  /* 物品格子 */
  .items-grid {
    display: grid; grid-template-columns: repeat(5, 110px); gap: 12px;
    align-content: start;
  }
  .item-slot {
    width: 110px; height: 110px; background: #F8F4E8;
    border: 2px solid #8B6F47; display: flex; flex-direction: column;
    align-items: center; justify-content: center; position: relative;
  }
  .item-slot .icon { font-size: 48px; }
  .item-slot .count {
    position: absolute; bottom: 4px; right: 6px;
    font-size: 14px; color: #5a4a3a;
  }
  .item-slot.empty { opacity: 0.4; }
  /* 右侧详情 */
  .detail-panel {
    flex: 1; background: #F8F4E8; border: 2px solid #8B6F47;
    padding: 24px;
  }
  .detail-name { font-size: 32px; color: #2C2C2C; margin-bottom: 12px; }
  .quality-tag {
    display: inline-block; padding: 4px 16px; font-size: 16px;
    background: #2a6b5a; color: #F5F0E1; margin-bottom: 20px;
  }
  .detail-desc { font-size: 18px; color: #5a4a3a; line-height: 1.8; margin-bottom: 24px; }
  .stat-row { font-size: 18px; color: #2C2C2C; line-height: 2; }
  .stat-row .label { color: #5a4a3a; display: inline-block; width: 100px; }
  /* 底部操作 */
  .bottom-actions {
    display: flex; justify-content: center; gap: 24px; padding: 20px 0 30px;
  }
  .btn {
    padding: 12px 36px; font-size: 18px; border: 2px solid #8B6F47;
    background: #F8F4E8; color: #2C2C2C; cursor: pointer;
  }
  .btn.primary { background: #B83A2A; color: #F5F0E1; border-color: #C9A961; }
  .currency-bar {
    display: flex; justify-content: center; gap: 40px;
    padding-bottom: 16px; font-size: 18px; color: #5a4a3a;
  }
</style>
</head>
<body>
<div class="screen">
  <div class="bg-mountain"></div>

  <div class="main-panel">
    <div class="panel-title">乾坤袋<span class="seal">袋</span></div>

    <div class="tabs">
      <div class="tab active">全部</div>
      <div class="tab">装备</div>
      <div class="tab">消耗品</div>
      <div class="tab">材料</div>
      <div class="tab">任务</div>
    </div>

    <div class="content">
      <div class="items-grid">
        <div class="item-slot"><span class="icon">🗡</span><span class="count">1</span></div>
        <div class="item-slot"><span class="icon">🫙</span><span class="count">3</span></div>
        <div class="item-slot"><span class="icon">🏺</span><span class="count">2</span></div>
        <div class="item-slot"><span class="icon">📖</span><span class="count">6</span></div>
        <div class="item-slot"><span class="icon">💎</span><span class="count">6</span></div>

        <div class="item-slot"><span class="icon">🛡</span><span class="count">1</span></div>
        <div class="item-slot"><span class="icon">符</span><span class="count">5</span></div>
        <div class="item-slot"><span class="icon">🍶</span><span class="count">2</span></div>
        <div class="item-slot"><span class="icon">📿</span><span class="count">2</span></div>
        <div class="item-slot"><span class="icon">🪵</span><span class="count">木</span></div>

        <div class="item-slot"><span class="icon">🥾</span><span class="count">3</span></div>
        <div class="item-slot"><span class="icon">📜</span><span class="count">2</span></div>
        <div class="item-slot"><span class="icon">🌿</span><span class="count">3</span></div>
        <div class="item-slot"><span class="icon">💠</span><span class="count">石</span></div>
        <div class="item-slot"><span class="icon">🟫</span><span class="count">皮</span></div>

        <div class="item-slot empty"></div>
        <div class="item-slot empty"></div>
        <div class="item-slot empty"></div>
        <div class="item-slot empty"></div>
        <div class="item-slot empty"></div>
      </div>

      <div class="detail-panel">
        <div class="detail-name">青锋剑</div>
        <div class="quality-tag">凡品</div>
        <div class="detail-desc">青云山弟子常用佩剑，剑身清冷，锋利无比。</div>
        <div class="stat-row"><span class="label">攻击</span>+128</div>
        <div class="stat-row"><span class="label">攻速</span>+5%</div>
        <div class="stat-row"><span class="label">等级需求</span>30级</div>
      </div>
    </div>

    <div class="bottom-actions">
      <div class="btn">使用</div>
      <div class="btn">丢弃</div>
      <div class="btn">整理</div>
      <div class="btn">拆分</div>
    </div>
    <div class="currency-bar">
      <span>🪙 铜钱 125,800</span>
      <span>💎 灵石 3,200</span>
    </div>
  </div>
</div>
</body>
</html>
