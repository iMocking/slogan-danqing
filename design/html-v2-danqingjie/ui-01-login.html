<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>丹青劫·无限 - 登录</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1920px; height: 1080px; overflow: hidden;
    font-family: "KaiTi", "STKaiti", "楷体", serif;
    background: #F5F0E1;
  }
  .screen {
    position: relative; width: 1920px; height: 1080px;
    background: linear-gradient(180deg, #e8e4d8 0%, #d4d0c4 40%, #c8c4b8 100%);
  }
  /* 水墨山水背景 */
  .bg-mountain {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 600px 300px at 20% 60%, rgba(60,60,60,0.25) 0%, transparent 70%),
      radial-gradient(ellipse 800px 400px at 80% 50%, rgba(50,50,50,0.2) 0%, transparent 70%),
      radial-gradient(ellipse 500px 250px at 50% 70%, rgba(70,70,70,0.15) 0%, transparent 70%),
      linear-gradient(180deg, #f0ece0 0%, #e0dcd0 60%, #c8c4b8 100%);
  }
  .bg-mountain::before {
    content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 300px 150px at 15% 45%, rgba(40,40,40,0.3) 0%, transparent 70%),
      radial-gradient(ellipse 400px 200px at 85% 40%, rgba(45,45,45,0.25) 0%, transparent 70%);
  }
  /* 松树剪影 */
  .pine {
    position: absolute; left: 80px; top: 350px;
    width: 280px; height: 400px;
    opacity: 0.7;
  }
  /* 标题区 */
  .title-area {
    position: absolute; top: 80px; left: 50%; transform: translateX(-50%);
    text-align: center; z-index: 10;
  }
  .game-title {
    font-size: 140px; font-weight: 900; color: #1a1a1a;
    letter-spacing: 20px; text-shadow: 4px 4px 8px rgba(0,0,0,0.15);
    line-height: 1;
  }
  .seal-infinite {
    display: inline-flex; align-items: center; justify-content: center;
    width: 80px; height: 80px; background: #B83A2A;
    color: #F5F0E1; font-size: 32px; font-weight: bold;
    margin-top: 20px; border-radius: 4px;
    box-shadow: 2px 2px 6px rgba(0,0,0,0.2);
  }
  .subtitle-vertical {
    position: absolute; right: -100px; top: 0;
    writing-mode: vertical-rl;
    font-size: 24px; color: #5a4a3a; letter-spacing: 8px;
  }
  .small-seal {
    display: inline-block; width: 28px; height: 28px;
    background: #B83A2A; color: #F5F0E1;
    font-size: 12px; text-align: center; line-height: 28px;
    margin-left: 8px; border-radius: 3px;
  }
  /* 卷轴面板 */
  .scroll-panel {
    position: absolute; top: 480px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: stretch; z-index: 10;
  }
  .scroll-rod {
    width: 20px; background: #5a4a3a;
    position: relative;
  }
  .scroll-rod::before, .scroll-rod::after {
    content: ""; position: absolute; left: -6px; width: 32px; height: 32px;
    background: #8B6F47; border-radius: 50%;
  }
  .scroll-rod::before { top: -16px; }
  .scroll-rod::after { bottom: -16px; }
  .scroll-body {
    width: 680px; height: 440px;
    background: #EDE4D0;
    border: 3px solid #8B6F47;
    padding: 30px 60px;
    display: flex; flex-direction: column; align-items: center;
    box-shadow: 0 8px 32px rgba(0,0,0,0.15);
  }
  .panel-seal {
    width: 52px; height: 52px; background: #B83A2A;
    color: #F5F0E1; font-size: 16px; font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    border-radius: 4px; margin-bottom: 24px;
  }
  .input-row {
    width: 480px; height: 56px; background: #F8F4E8;
    border: 2px solid #8B6F47; margin-bottom: 18px;
    display: flex; align-items: center; padding: 0 16px;
  }
  .input-row .icon {
    width: 30px; color: #8B6F47; font-size: 20px;
  }
  .input-row .placeholder {
    flex: 1; color: #9A8B75; font-size: 18px; padding-left: 12px;
  }
  .btn-primary {
    width: 320px; height: 64px; background: #B83A2A;
    border: 2px solid #C9A961; color: #F5F0E1;
    font-size: 28px; font-weight: bold; letter-spacing: 6px;
    display: flex; align-items: center; justify-content: center;
    margin-top: 20px; cursor: pointer;
  }
  .links-row {
    display: flex; align-items: center; gap: 20px; margin-top: 24px;
    color: #5a4a3a; font-size: 16px;
  }
  .divider { width: 1px; height: 16px; background: #8B6F47; }
  /* 底部 */
  .footer {
    position: absolute; bottom: 24px; left: 40px; right: 40px;
    display: flex; justify-content: space-between;
    color: #5a4a3a; font-size: 14px; z-index: 10;
  }
  /* 装饰云纹 */
  .cloud {
    position: absolute; opacity: 0.3;
    color: #8B6F47; font-size: 40px;
  }
</style>
</head>
<body>
<div class="screen">
  <div class="bg-mountain"></div>

  <!-- 装饰云纹 -->
  <div class="cloud" style="top: 120px; left: 300px;">☁</div>
  <div class="cloud" style="top: 100px; right: 350px; font-size: 50px;">☁</div>

  <!-- 标题区 -->
  <div class="title-area">
    <div style="display: flex; align-items: flex-start; justify-content: center;">
      <div>
        <div class="game-title">丹青劫</div>
        <div style="text-align: center;"><span class="seal-infinite">无限</span></div>
      </div>
      <div style="position: relative; margin-left: 16px; margin-top: 10px;">
        <div class="subtitle-vertical">墨染山河·劫起长生</div>
        <div style="position: absolute; right: -30px; top: 220px;"><span class="small-seal">印</span></div>
      </div>
    </div>
  </div>

  <!-- 卷轴登录面板 -->
  <div class="scroll-panel">
    <div class="scroll-rod"></div>
    <div class="scroll-body">
      <div class="panel-seal">丹青劫</div>
      <div class="input-row">
        <span class="icon">✒</span>
        <span class="placeholder">请输入账号</span>
      </div>
      <div class="input-row">
        <span class="icon">🔒</span>
        <span class="placeholder">请输入密码</span>
      </div>
      <div class="btn-primary">踏入丹青劫</div>
      <div class="links-row">
        <span>注册新号</span>
        <div class="divider"></div>
        <span>找回密码</span>
        <div class="divider"></div>
        <span>选择服务器</span>
      </div>
    </div>
    <div class="scroll-rod"></div>
  </div>

  <!-- 底部 -->
  <div class="footer">
    <span>版本号：1.0.0</span>
    <span>© 丹青劫工作室 版权所有</span>
  </div>
</div>
</body>
</html>
