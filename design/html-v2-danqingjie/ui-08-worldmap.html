<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>丹青劫·无限 - 世界地图</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1920px; height: 1080px; overflow: hidden;
    font-family: "KaiTi", "STKaiti", "楷体", serif;
    background: #2a2a2a;
  }
  .screen {
    position: relative; width: 1920px; height: 1080px;
    background: #2a2a2a;
  }
  /* 卷轴展开 */
  .scroll-map {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 1800px; height: 950px;
    background: #EDE4D0; border: 8px solid #5a4a3a;
    box-shadow: 0 16px 64px rgba(0,0,0,0.5);
    display: flex;
  }
  .scroll-edge {
    width: 30px; background: #5a4a3a; position: relative;
  }
  .scroll-edge::before, .scroll-edge::after {
    content: ""; position: absolute; left: -8px; width: 46px; height: 46px;
    background: #8B6F47; border-radius: 50%;
  }
  .scroll-edge::before { top: -23px; }
  .scroll-edge::after { bottom: -23px; }
  .map-content {
    flex: 1; padding: 30px 50px; position: relative;
    background:
      radial-gradient(ellipse 400px 200px at 20% 30%, rgba(80,100,80,0.2) 0%, transparent 70%),
      radial-gradient(ellipse 500px 250px at 70% 60%, rgba(70,90,70,0.15) 0%, transparent 70%),
      radial-gradient(ellipse 300px 150px at 50% 20%, rgba(100,120,100,0.15) 0%, transparent 70%);
  }
  .map-title {
    font-size: 52px; color: #2C2C2C; letter-spacing: 8px; font-weight: bold;
    margin-bottom: 20px;
  }
  .map-title .seal {
    display: inline-block; width: 28px; height: 28px;
    background: #B83A2A; color: #F5F0E1; font-size: 12px;
    vertical-align: middle; margin-left: 8px; border-radius: 3px;
  }
  /* 地图区域标记 */
  .map-area {
    position: absolute; text-align: center;
  }
  .map-area .name {
    font-size: 22px; color: #2C2C2C; writing-mode: vertical-rl;
    letter-spacing: 6px; background: rgba(237,228,208,0.9);
    padding: 8px 6px; border: 1px solid #8B6F47;
  }
  .map-area .icon { font-size: 36px; }
  /* 指南针 */
  .compass {
    position: absolute; bottom: 40px; left: 40px;
    width: 80px; height: 80px; border: 2px solid #8B6F47;
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 32px; color: #B83A2A;
  }
  .compass-label {
    position: absolute; bottom: 120px; left: 60px;
    font-size: 18px; color: #5a4a3a;
  }
  /* 缩放按钮 */
  .zoom-controls {
    position: absolute; top: 80px; right: 40px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .zoom-btn {
    width: 44px; height: 44px; border-radius: 50%;
    background: #3a3a3a; color: #F5F0E1; border: 2px solid #8B6F47;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; cursor: pointer;
  }
  /* 底部功能按钮 */
  .map-actions {
    position: absolute; bottom: 40px; right: 40px;
    display: flex; gap: 16px;
  }
  .map-btn {
    padding: 12px 28px; background: #3a3a3a; color: #F5F0E1;
    border: 2px solid #8B6F47; font-size: 18px; cursor: pointer;
  }
  /* 当前位置标记 */
  .current-pos {
    position: absolute; width: 20px; height: 20px;
    background: #B83A2A; border-radius: 50%;
    box-shadow: 0 0 0 4px rgba(184,58,42,0.3);
  }
</style>
</head>
<body>
<div class="screen">
  <div class="scroll-map">
    <div class="scroll-edge"></div>
    <div class="map-content">
      <div class="map-title">丹青世界全图<span class="seal">图</span></div>

      <!-- 北荒雪原 -->
      <div class="map-area" style="top: 120px; left: 120px;">
        <div class="icon">🏔</div>
        <div class="name">北荒雪原</div>
      </div>

      <!-- 青云山 -->
      <div class="map-area" style="top: 100px; left: 750px;">
        <div class="icon">⛰</div>
        <div class="name">青云山</div>
      </div>

      <!-- 东海蓬莱 -->
      <div class="map-area" style="top: 140px; right: 200px;">
        <div class="icon">🏝</div>
        <div class="name">东海蓬莱</div>
      </div>

      <!-- 万妖谷 -->
      <div class="map-area" style="top: 320px; left: 280px;">
        <div class="icon">🌲</div>
        <div class="name">万妖谷</div>
      </div>

      <!-- 魔域深渊 -->
      <div class="map-area" style="top: 380px; right: 180px;">
        <div class="icon">🏯</div>
        <div class="name">魔域深渊</div>
      </div>

      <!-- 南疆沼泽 -->
      <div class="map-area" style="bottom: 180px; left: 200px;">
        <div class="icon">🌊</div>
        <div class="name">南疆沼泽</div>
      </div>

      <!-- 中原皇城 -->
      <div class="map-area" style="bottom: 160px; left: 750px;">
        <div class="icon">🏯</div>
        <div class="name">中原皇城</div>
      </div>

      <!-- 西漠流沙 -->
      <div class="map-area" style="bottom: 200px; right: 160px;">
        <div class="icon">🏜</div>
        <div class="name">西漠流沙</div>
      </div>

      <!-- 当前位置 -->
      <div class="current-pos" style="top: 280px; left: 830px;"></div>

      <!-- 指南针 -->
      <div class="compass-label">北</div>
      <div class="compass">✦</div>

      <!-- 缩放按钮 -->
      <div class="zoom-controls">
        <div class="zoom-btn">+</div>
        <div class="zoom-btn">−</div>
      </div>

      <!-- 底部功能 -->
      <div class="map-actions">
        <div class="map-btn">世界地图</div>
        <div class="map-btn">区域地图</div>
        <div class="map-btn">传送阵</div>
      </div>
    </div>
    <div class="scroll-edge"></div>
  </div>
</div>
</body>
</html>
